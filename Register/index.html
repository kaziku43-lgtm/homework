<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9; 
            font-family: "Kantumruy Pro", sans-serif;
        }

        .card {
            display: flex;
            width: 70%;
            max-width: 800px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px 2px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .logo {
            width: 45%;
            background: rgb(45, 40, 121);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .logo img {
            width: 100%;
            max-width: 200px;
            border-radius: 50%;
        }

        .frm {
            width: 55%;
            background: white; 
            padding: 40px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 10px;
        }

        h4 {
            text-align: center;
            color: #666;
            font-weight: normal;
            margin-top: 0;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .input {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid gray; 
            line-height: 20px;
            padding: 10px;
            border-radius: 5px;
            font-family: "Kantumruy Pro", sans-serif;
            margin-bottom: 20px;
        }

        .input:focus {
            box-shadow: 0 0 5px 1px rgb(45, 40, 121);
            border-color: rgb(45, 40, 121);
            outline: none;
            transition: 0.3s;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        button[type="submit"] {
            width: 100%;
            border: none;
            background: rgb(45, 40, 121); 
            color: white;
            padding: 12px 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 16px;
            margin-bottom: 10px;
        }

        button[type="submit"]:hover {
            background: rgb(22, 19, 59);
            color: white;
            transition: 0.3s;
        }

        .buttonn {
            display: block;
            width: 100%;
            text-align: center;
            text-decoration: none;
            background: none;
            border: none;
            color: rgb(85, 78, 177);
            margin-top: 15px;
            cursor: pointer;
            font-size: 15px;
            font-family: "Kantumruy Pro", sans-serif;
        }
        
        .buttonn:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">
            <img src="sytem.jpg" alt="Logo">
        </div>

        <form action="" class="frm">
            <h2>Forgot Password</h2>
            <h4>Enter your email address and we will send you instructions to reset your password.</h4>
             
            <label for="email">Email</label>
            <input id="email" class="input" type="email" name="email"
                   required maxlength="50" placeholder="Your_email@gmail.com">
        
            <button type="submit">Send Reset Instructions</button>
            <a href="index3.html" class="buttonn">Back to Login</a>
        </form>
    </div>
    
</body>
</html>
